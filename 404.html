function decodePatch(){
  const raw=atob(PATCH_B64); const bytes=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
function applyUnifiedPatch(source,patch){
  const src=source.split('\n'); const lines=patch.split('\n'); const out=[]; let cursor=0; let i=0;
  while(i<lines.length){
    const header=lines[i].match(/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
    if(!header){i++;continue;}
    const start=Number(header[1])-1;
    if(start<cursor)throw new Error('Overlapping patch hunk');
    out.push(...src.slice(cursor,start)); cursor=start; i++;
    while(i<lines.length && !lines[i].startsWith('@@ ')){
      const line=lines[i];
      if(line.startsWith('--- ')||line.startsWith('+++ ')){i++;continue;}
      if(line==='\ No newline at end of file'){i++;continue;}
      const op=line.charAt(0), text=line.slice(1);
      if(op===' '){if(src[cursor]!==text)throw new Error('Patch context mismatch');out.push(text);cursor++;}
      else if(op==='-'){if(src[cursor]!==text)throw new Error('Patch removal mismatch');cursor++;}
      else if(op==='+'){out.push(text);}
      else if(line!=='')throw new Error('Unsupported patch line');
      i++;
    }
  }
  out.push(...src.slice(cursor));
  return out.join('\n');
}
async function boot(){
